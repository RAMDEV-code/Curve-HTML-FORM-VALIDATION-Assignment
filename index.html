<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>

    <header>
        <h1>Contact Abdulrahmon</h1>
        <p>Have a question? Send us a message.</p>
    </header>

    <main>
        <form action="#" method="get">

            <div>
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >
            </div>

            <br>

            <div>
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <br>

            <div>
                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    pattern="[0-9]{11}"
                    title="Enter an 11-digit phone number, e.g. 08012345678."
                    required
                >
            </div>

            <br>

            <fieldset>
                <legend>Preferred Contact Method</legend>

                <input
                    type="radio"
                    id="contact-email"
                    name="contact-method"
                    value="email"
                    required
                >
                <label for="contact-email">Email</label>

                <input
                    type="radio"
                    id="contact-phone"
                    name="contact-method"
                    value="phone"
                >
                <label for="contact-phone">Phone</label>
            </fieldset>

            <br>

            <div>
                <label for="message">Your Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                ></textarea>
            </div>

            <br>

            <button type="submit">Send Message</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Contact Us</p>
    </footer>

</body>
</html>
